name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  cask:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Put the checkout where brew reads taps
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/antontuzov"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/antontuzov/homebrew-openmonkey"

      - name: Audit and style
        run: |
          brew audit --cask --strict --online antontuzov/openmonkey/openmonkey
          brew style --cask antontuzov/openmonkey/openmonkey

      - name: Install, read the bundle back, uninstall
        run: |
          brew install --cask antontuzov/openmonkey/openmonkey
          test -d /Applications/OpenMonkey.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' /Applications/OpenMonkey.app/Contents/Info.plist)" = "ai.openmonkey.app"
          brew uninstall --zap --cask antontuzov/openmonkey/openmonkey
          test ! -d /Applications/OpenMonkey.app